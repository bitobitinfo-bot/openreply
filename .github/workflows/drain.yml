# Serverless worker: pings the app every 10 minutes so delayed DMs, retries
# and the missed-comment sweep run without an always-on server.
# Needs two repository secrets: APP_URL (e.g. https://your-app.vercel.app)
# and CRON_SECRET (same value as on Vercel).
name: Drain DM queue
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/drain
        run: |
          curl -fsS --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/drain"
